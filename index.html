<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factory Simulation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 20px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── Controls ──────────────────────────────────────────── */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      align-items: flex-end;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px 20px;
      width: 100%;
      max-width: 960px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-group label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .control-group input[type="number"] {
      width: 90px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 14px;
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    .control-group input[type="number"]:focus {
      border-color: #3b82f6;
    }

    .divider {
      width: 1px;
      height: 48px;
      background: #334155;
      align-self: center;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      align-self: flex-end;
      margin-left: auto;
    }

    button {
      padding: 7px 18px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    #startBtn {
      background: #3b82f6;
      color: #fff;
    }

    #startBtn.paused {
      background: #f59e0b;
    }

    #resetBtn {
      background: #334155;
      color: #cbd5e1;
    }

    #resetBtn:hover { background: #475569; }

    /* ── SVG diagram ───────────────────────────────────────── */
    .diagram-wrapper {
      width: 100%;
      max-width: 960px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
    }

    #diagram {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── Data panel ────────────────────────────────────────── */
    .data-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 960px;
    }

    .data-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px 16px;
    }

    .data-card .label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .data-card .value {
      font-size: 22px;
      font-weight: 700;
      color: #e2e8f0;
      font-variant-numeric: tabular-nums;
    }

    .data-card .unit {
      font-size: 11px;
      color: #64748b;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <h1>Factory Simulation</h1>

  <!-- ── Controls ── -->
  <div class="controls">
    <div class="control-group">
      <label>Flow 1 — Inflow (u/s)</label>
      <input type="number" id="r1" min="0" max="100" value="10" step="1">
    </div>
    <div class="control-group">
      <label>Flow 2 — Transfer (u/s)</label>
      <input type="number" id="r2" min="0" max="100" value="8" step="1">
    </div>
    <div class="control-group">
      <label>Flow 3 — Outflow (u/s)</label>
      <input type="number" id="r3" min="0" max="100" value="6" step="1">
    </div>
    <div class="divider"></div>
    <div class="control-group">
      <label>Stock 1 initial</label>
      <input type="number" id="s1init" min="0" max="200" value="50" step="1">
    </div>
    <div class="control-group">
      <label>Stock 2 initial</label>
      <input type="number" id="s2init" min="0" max="200" value="50" step="1">
    </div>
    <div class="btn-group">
      <button id="startBtn">Start</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>

  <!-- ── SVG Diagram ── -->
  <div class="diagram-wrapper">
    <svg id="diagram" viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">

      <!-- ── Defs (arrowhead marker) ── -->
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 Z" fill="#475569"/>
        </marker>
        <marker id="arrow-f1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 Z" fill="#60a5fa"/>
        </marker>
        <marker id="arrow-f2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 Z" fill="#a78bfa"/>
        </marker>
        <marker id="arrow-f3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 Z" fill="#34d399"/>
        </marker>
      </defs>

      <!-- ── Background grid lines (subtle) ── -->
      <line x1="0" y1="210" x2="960" y2="210" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 6"/>

      <!-- ────────────────────────────────
           FLOW PATHS (drawn under stocks)
      ──────────────────────────────────── -->

      <!-- Flow 1: source (x=80) → Stock 1 left edge (x=260) -->
      <path id="path-f1"
        d="M 80 210 C 150 210 200 210 258 210"
        stroke="#60a5fa" stroke-width="2.5" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrow-f1)"/>

      <!-- Flow 2: Stock 1 right edge (x=382) → Stock 2 left edge (x=578) -->
      <path id="path-f2"
        d="M 384 210 C 450 210 510 210 578 210"
        stroke="#a78bfa" stroke-width="2.5" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrow-f2)"/>

      <!-- Flow 3: Stock 2 right edge (x=702) → sink (x=880) -->
      <path id="path-f3"
        d="M 704 210 C 760 210 820 210 878 210"
        stroke="#34d399" stroke-width="2.5" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrow-f3)"/>

      <!-- ────────────────────────────────
           SOURCE & SINK nodes
      ──────────────────────────────────── -->

      <!-- Source -->
      <circle cx="60" cy="210" r="18" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
      <text x="60" y="214" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">IN</text>

      <!-- Sink -->
      <circle cx="898" cy="210" r="18" fill="#1e2a1e" stroke="#34d399" stroke-width="2"/>
      <text x="898" y="214" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">OUT</text>

      <!-- ────────────────────────────────
           STOCK 1  (x=260, centered at y=210, h=240)
      ──────────────────────────────────── -->

      <!-- Outer container -->
      <rect id="s1-outer" x="260" y="90" width="122" height="240" rx="6"
        fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <!-- Fill clip boundary (inner slightly inset) -->
      <clipPath id="clip-s1">
        <rect x="263" y="93" width="116" height="234"/>
      </clipPath>
      <!-- Fill rect (anchored to bottom, height changes with value) -->
      <rect id="s1-fill" x="263" y="327" width="116" height="0"
        fill="#3b82f6" clip-path="url(#clip-s1)" rx="3"/>
      <!-- Top shimmer line -->
      <rect id="s1-shimmer" x="263" y="327" width="116" height="3"
        fill="#93c5fd" opacity="0.6" clip-path="url(#clip-s1)"/>
      <!-- Capacity label line at 100% -->
      <line x1="260" y1="93" x2="382" y2="93" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
      <!-- Label -->
      <text x="321" y="76" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700">STOCK 1</text>
      <!-- Quantity display -->
      <text id="s1-label" x="321" y="355" text-anchor="middle" fill="#e2e8f0"
        font-size="14" font-weight="700" font-family="monospace">50</text>
      <text x="321" y="368" text-anchor="middle" fill="#64748b" font-size="10">units</text>

      <!-- ────────────────────────────────
           STOCK 2  (x=578, same dimensions)
      ──────────────────────────────────── -->

      <rect id="s2-outer" x="578" y="90" width="122" height="240" rx="6"
        fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <clipPath id="clip-s2">
        <rect x="581" y="93" width="116" height="234"/>
      </clipPath>
      <rect id="s2-fill" x="581" y="327" width="116" height="0"
        fill="#3b82f6" clip-path="url(#clip-s2)" rx="3"/>
      <rect id="s2-shimmer" x="581" y="327" width="116" height="3"
        fill="#93c5fd" opacity="0.6" clip-path="url(#clip-s2)"/>
      <line x1="578" y1="93" x2="700" y2="93" stroke="#475569" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="639" y="76" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700">STOCK 2</text>
      <text id="s2-label" x="639" y="355" text-anchor="middle" fill="#e2e8f0"
        font-size="14" font-weight="700" font-family="monospace">50</text>
      <text x="639" y="368" text-anchor="middle" fill="#64748b" font-size="10">units</text>

      <!-- ────────────────────────────────
           FLOW RATE LABELS (above paths)
      ──────────────────────────────────── -->

      <text x="169" y="196" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">
        F1: <tspan id="f1-label">10.0</tspan> u/s
      </text>
      <text x="481" y="196" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">
        F2: <tspan id="f2-label">8.0</tspan> u/s
      </text>
      <text x="791" y="196" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">
        F3: <tspan id="f3-label">6.0</tspan> u/s
      </text>

      <!-- ── Particles layer (drawn on top of everything) ── -->
      <g id="particles"></g>

    </svg>
  </div>

  <!-- ── Data Panel ── -->
  <div class="data-panel">
    <div class="data-card">
      <div class="label">Stock 1</div>
      <div class="value"><span id="dp-s1">50.0</span><span class="unit">units</span></div>
    </div>
    <div class="data-card">
      <div class="label">Stock 2</div>
      <div class="value"><span id="dp-s2">50.0</span><span class="unit">units</span></div>
    </div>
    <div class="data-card">
      <div class="label">Elapsed</div>
      <div class="value"><span id="dp-time">0.0</span><span class="unit">s</span></div>
    </div>
    <div class="data-card">
      <div class="label">Flow 1 Actual</div>
      <div class="value"><span id="dp-f1">0.0</span><span class="unit">u/s</span></div>
    </div>
    <div class="data-card">
      <div class="label">Flow 2 Actual</div>
      <div class="value"><span id="dp-f2">0.0</span><span class="unit">u/s</span></div>
    </div>
    <div class="data-card">
      <div class="label">Flow 3 Actual</div>
      <div class="value"><span id="dp-f3">0.0</span><span class="unit">u/s</span></div>
    </div>
  </div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════
const CAPACITY      = 200;   // units
const FILL_HEIGHT   = 234;   // px of SVG fill area per stock
const FILL_BOTTOM   = 327;   // SVG y of bottom of fill area (S1; S2 is same relative)
const S2_FILL_BOTTOM = 327;
const PARTICLE_TRAVEL_SEC = 2.5;  // seconds to traverse a full flow path

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
const state = {
  stocks: [
    { value: 50, initial: 50 },
    { value: 50, initial: 50 }
  ],
  flows: [
    { rate: 10, actual: 0 },   // F1: source → S1
    { rate: 8,  actual: 0 },   // F2: S1 → S2
    { rate: 6,  actual: 0 }    // F3: S2 → sink
  ],
  particles: [],
  spawnAccum: [0, 0, 0],
  elapsed: 0,
  running: false,
  nextId: 0
};

// ═══════════════════════════════════════════════════════════
//  DOM REFS  (pre-selected — never queried in hot loop)
// ═══════════════════════════════════════════════════════════
const dom = {
  // stocks
  s1fill:    document.getElementById('s1-fill'),
  s1shimmer: document.getElementById('s1-shimmer'),
  s1label:   document.getElementById('s1-label'),
  s2fill:    document.getElementById('s2-fill'),
  s2shimmer: document.getElementById('s2-shimmer'),
  s2label:   document.getElementById('s2-label'),
  s1outer:   document.getElementById('s1-outer'),
  s2outer:   document.getElementById('s2-outer'),
  // flow labels
  f1label:   document.getElementById('f1-label'),
  f2label:   document.getElementById('f2-label'),
  f3label:   document.getElementById('f3-label'),
  // particles group
  particles: document.getElementById('particles'),
  // data panel
  dpS1:      document.getElementById('dp-s1'),
  dpS2:      document.getElementById('dp-s2'),
  dpTime:    document.getElementById('dp-time'),
  dpF1:      document.getElementById('dp-f1'),
  dpF2:      document.getElementById('dp-f2'),
  dpF3:      document.getElementById('dp-f3'),
  // controls
  startBtn:  document.getElementById('startBtn'),
  resetBtn:  document.getElementById('resetBtn'),
  r1:        document.getElementById('r1'),
  r2:        document.getElementById('r2'),
  r3:        document.getElementById('r3'),
  s1init:    document.getElementById('s1init'),
  s2init:    document.getElementById('s2init')
};

// SVG path elements for getPointAtLength
const paths = [
  document.getElementById('path-f1'),
  document.getElementById('path-f2'),
  document.getElementById('path-f3')
];

// Particle colors per flow
const PARTICLE_COLORS = ['#60a5fa', '#a78bfa', '#34d399'];
const PARTICLE_STROKE = ['#bfdbfe', '#ddd6fe', '#a7f3d0'];

// ═══════════════════════════════════════════════════════════
//  SIMULATION LOGIC
// ═══════════════════════════════════════════════════════════
function updateSimulation(dt) {
  const s1 = state.stocks[0];
  const s2 = state.stocks[1];
  const f1 = state.flows[0];
  const f2 = state.flows[1];
  const f3 = state.flows[2];

  // Actual rates (constrained by availability + capacity)
  f1.actual = Math.min(f1.rate, (CAPACITY - s1.value) / dt);
  f2.actual = Math.min(f2.rate, s1.value / dt);
  f3.actual = Math.min(f3.rate, s2.value / dt);

  // Clamp to zero (no negative rates)
  f1.actual = Math.max(0, f1.actual);
  f2.actual = Math.max(0, f2.actual);
  f3.actual = Math.max(0, f3.actual);

  // Update stocks
  s1.value += (f1.actual - f2.actual) * dt;
  s2.value += (f2.actual - f3.actual) * dt;
  s1.value = Math.max(0, Math.min(CAPACITY, s1.value));
  s2.value = Math.max(0, Math.min(CAPACITY, s2.value));

  // Spawn particles for each flow
  const actuals = [f1.actual, f2.actual, f3.actual];
  for (let i = 0; i < 3; i++) {
    state.spawnAccum[i] += actuals[i] * dt;
    while (state.spawnAccum[i] >= 1) {
      state.spawnAccum[i] -= 1;
      spawnParticle(i);
    }
  }

  // Advance particles — crowding effect based on downstream stock fill
  const crowding = [
    s1.value / CAPACITY,   // downstream of F1 is S1
    s2.value / CAPACITY,   // downstream of F2 is S2
    0                      // F3 drains to external sink — no crowding
  ];

  const toRemove = [];
  for (const p of state.particles) {
    const speed = (1 / PARTICLE_TRAVEL_SEC) * (1 - 0.65 * crowding[p.flow]);
    p.t += speed * dt;
    if (p.t >= 1) toRemove.push(p);
  }

  for (const p of toRemove) {
    removeParticle(p);
  }

  state.elapsed += dt;
}

// ═══════════════════════════════════════════════════════════
//  PARTICLE MANAGEMENT
// ═══════════════════════════════════════════════════════════
function spawnParticle(flowIndex) {
  const id = state.nextId++;
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  el.setAttribute('r', '7');
  el.setAttribute('fill', PARTICLE_COLORS[flowIndex]);
  el.setAttribute('stroke', PARTICLE_STROKE[flowIndex]);
  el.setAttribute('stroke-width', '1.5');
  el.setAttribute('opacity', '0.9');
  dom.particles.appendChild(el);

  const p = { id, flow: flowIndex, t: 0, el };
  state.particles.push(p);
  return p;
}

function removeParticle(p) {
  const idx = state.particles.indexOf(p);
  if (idx !== -1) state.particles.splice(idx, 1);
  if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
}

function clearAllParticles() {
  for (const p of state.particles) {
    if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
  }
  state.particles.length = 0;
  state.spawnAccum[0] = state.spawnAccum[1] = state.spawnAccum[2] = 0;
}

// ═══════════════════════════════════════════════════════════
//  RENDERING
// ═══════════════════════════════════════════════════════════
function getFillColor(ratio) {
  if (ratio > 0.9) return '#ef4444';   // red — near full
  if (ratio < 0.1) return '#f59e0b';   // amber — near empty
  return '#3b82f6';                    // blue — normal
}

function renderFrame() {
  // Stocks
  for (let i = 0; i < 2; i++) {
    const stock = state.stocks[i];
    const ratio = stock.value / CAPACITY;
    const fillH = ratio * FILL_HEIGHT;
    const fillY = FILL_BOTTOM - fillH;
    const color = getFillColor(ratio);

    const fill    = i === 0 ? dom.s1fill    : dom.s2fill;
    const shimmer = i === 0 ? dom.s1shimmer : dom.s2shimmer;
    const label   = i === 0 ? dom.s1label   : dom.s2label;
    const outer   = i === 0 ? dom.s1outer   : dom.s2outer;

    fill.setAttribute('y', fillY);
    fill.setAttribute('height', fillH);
    fill.setAttribute('fill', color);
    shimmer.setAttribute('y', fillY);
    // Hide shimmer when fill is tiny
    shimmer.setAttribute('opacity', fillH > 5 ? '0.6' : '0');
    label.textContent = stock.value.toFixed(1);
    // Stock border color warning
    outer.setAttribute('stroke', ratio > 0.9 ? '#ef4444' : ratio < 0.1 ? '#f59e0b' : '#334155');
  }

  // Flow labels (actual rates)
  dom.f1label.textContent = state.flows[0].actual.toFixed(1);
  dom.f2label.textContent = state.flows[1].actual.toFixed(1);
  dom.f3label.textContent = state.flows[2].actual.toFixed(1);

  // Particles
  for (const p of state.particles) {
    const path = paths[p.flow];
    const len  = path.getTotalLength();
    const pt   = path.getPointAtLength(p.t * len);
    p.el.setAttribute('cx', pt.x);
    p.el.setAttribute('cy', pt.y);
  }

  // Data panel
  dom.dpS1.textContent   = state.stocks[0].value.toFixed(1);
  dom.dpS2.textContent   = state.stocks[1].value.toFixed(1);
  dom.dpTime.textContent = state.elapsed.toFixed(1);
  dom.dpF1.textContent   = state.flows[0].actual.toFixed(1);
  dom.dpF2.textContent   = state.flows[1].actual.toFixed(1);
  dom.dpF3.textContent   = state.flows[2].actual.toFixed(1);
}

// ═══════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════════
let lastTime = null;

function tick(timestamp) {
  if (state.running) {
    if (!lastTime) lastTime = timestamp;
    const wallDt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    updateSimulation(wallDt);
  }
  renderFrame();
  requestAnimationFrame(tick);
}

// Page visibility: reset dt on tab return to prevent jumps
document.addEventListener('visibilitychange', () => {
  if (document.hidden) lastTime = null;
});

// ═══════════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════════
function clampRate(v) {
  const n = parseFloat(v);
  return isNaN(n) ? 0 : Math.max(0, Math.min(100, n));
}

dom.r1.addEventListener('input', () => { state.flows[0].rate = clampRate(dom.r1.value); });
dom.r2.addEventListener('input', () => { state.flows[1].rate = clampRate(dom.r2.value); });
dom.r3.addEventListener('input', () => { state.flows[2].rate = clampRate(dom.r3.value); });

dom.startBtn.addEventListener('click', () => {
  state.running = !state.running;
  if (state.running) {
    lastTime = null;
    dom.startBtn.textContent = 'Pause';
    dom.startBtn.classList.add('paused');
  } else {
    dom.startBtn.textContent = 'Resume';
    dom.startBtn.classList.add('paused');
  }
});

dom.resetBtn.addEventListener('click', () => {
  state.running = false;
  lastTime = null;
  dom.startBtn.textContent = 'Start';
  dom.startBtn.classList.remove('paused');

  const initS1 = Math.max(0, Math.min(CAPACITY, parseFloat(dom.s1init.value) || 0));
  const initS2 = Math.max(0, Math.min(CAPACITY, parseFloat(dom.s2init.value) || 0));
  state.stocks[0].value = initS1;
  state.stocks[1].value = initS2;
  state.elapsed = 0;
  state.flows[0].actual = 0;
  state.flows[1].actual = 0;
  state.flows[2].actual = 0;

  clearAllParticles();
  renderFrame();
});

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
renderFrame();
requestAnimationFrame(tick);
</script>
