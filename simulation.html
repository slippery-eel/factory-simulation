<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation — Ohalo Seed Production</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      gap: 16px;
    }

    header { text-align: center; }
    h1 { font-size: 20px; font-weight: 700; color: #e2e8f0; letter-spacing: 0.04em; }
    .subtitle { font-size: 12px; color: #64748b; margin-top: 3px; }

    /* ── Controls ── */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      align-items: flex-start;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px 18px;
      width: 100%;
      max-width: 1240px;
    }

    .ctrl-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ctrl-section-label {
      font-size: 10px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .ctrl-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .control-group label {
      font-size: 10px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .control-group input[type="number"] {
      width: 84px;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 14px;
      padding: 5px 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    .control-group input[type="number"]:focus { border-color: #3b82f6; }

    .rate-convert {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
    }

    .util-hint {
      font-size: 10px;
      color: #475569;
      margin-top: 2px;
    }

    .divider {
      width: 1px; height: 48px;
      background: #334155;
      align-self: center;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      align-self: flex-end;
      margin-left: auto;
    }

    button {
      padding: 7px 18px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }

    #startBtn { background: #3b82f6; color: #fff; }
    #startBtn.paused { background: #f59e0b; }
    #resetBtn { background: #334155; color: #cbd5e1; }
    #resetBtn:hover { background: #475569; }

    /* ── SVG Diagram ── */
    .diagram-wrapper {
      width: 100%;
      max-width: 1240px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
    }

    #diagram { width: 100%; height: auto; display: block; }

    /* ── Throughput chart ── */
    .chart-wrapper {
      width: 100%; max-width: 1240px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px 10px;
    }

    #throughputChart {
      width: 100%;
      height: 180px;
      display: block;
    }

    /* ── Schedule visualizer ── */
    .sched-wrapper {
      width: 100%; max-width: 1240px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 16px 14px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .sched-content { flex: 1; }

    .sched-time {
      font-size: 17px;
      font-weight: 700;
      color: #e2e8f0;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sched-time-unit {
      font-size: 10px;
      font-weight: 400;
      color: #64748b;
      margin-left: 3px;
    }

    .sched-track {
      position: relative;
      display: flex;
      height: 22px;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 5px;
    }

    .sched-day {
      flex: 1;
      position: relative;
      background: #0f172a;
      border-right: 1px solid #1e2d3d;
    }
    .sched-day:last-child { border-right: none; }

    .sched-fill {
      position: absolute;
      left: 0; top: 0; height: 100%;
      width: 0;
      background: #064e3b;
      transition: width 0.25s ease;
    }

    .sched-cursor {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: #f1f5f9;
      pointer-events: none;
      transform: translateX(-50%);
      z-index: 2;
      box-shadow: 0 0 5px rgba(241, 245, 249, 0.5);
    }

    .sched-day-labels {
      display: flex;
    }

    .sched-day-labels span {
      flex: 1;
      text-align: center;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #475569;
    }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      gap: 4px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 6px;
      width: 100%;
      max-width: 1240px;
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 9px 20px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }

    .tab-btn:hover {
      background: #0f172a;
      color: #94a3b8;
    }

    .tab-active {
      background: #0f172a;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

<nav class="tab-bar">
  <a href="simulation.html" class="tab-btn tab-active">Simulation</a>
  <a href="opportunity-analysis.html" class="tab-btn">Opportunity Analysis &amp; ROI</a>
</nav>

<header>
  <h1>Living Factory Simulation</h1>
</header>

<!-- Controls -->
<div class="controls">
  <div class="ctrl-section">
    <div class="ctrl-section-label">Material Flows</div>
    <div class="ctrl-row">
      <div class="control-group">
        <label>Target (k plants/wk)</label>
        <input type="number" id="targetRate" min="0" max="5000" value="500" step="25">
        <div class="rate-convert" id="target-convert">= 6.25 k/hr</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="ctrl-section">
    <div class="ctrl-section-label">Pollination Station</div>
    <div class="ctrl-row">
      <div class="control-group">
        <label>Workers</label>
        <input type="number" id="numWorkers" min="1" max="10000" step="1" value="94">
        <div class="rate-convert" id="numWorkers-recommended">Recommended: 94</div>
      </div>
      <div class="control-group">
        <label>Plants / Session</label>
        <input type="number" id="plantsPerSession" min="1" max="1000" value="50" step="1">
        <div class="rate-convert" id="plantsPerSession-convert">= 0.0500 k-plants</div>
      </div>
      <div class="control-group">
        <label>Capacity</label>
        <div id="station-cap-derived" style="font-size:13px;color:#a78bfa;font-weight:700;margin-top:4px;">6.25 k/hr</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="ctrl-section">
    <div class="ctrl-section-label">Pollination Timing</div>
    <div class="ctrl-row">
      <div class="control-group">
        <label>Setup / Transport (min)</label>
        <input type="number" id="setupTime" min="1" max="240" value="15" step="1">
      </div>
      <div class="control-group">
        <label>Active Pollination (min)</label>
        <input type="number" id="pollTime" min="1" max="480" value="30" step="1">
      </div>
      <div class="control-group">
        <label>Output Lag</label>
        <div class="rate-convert" id="totalFlowTime" style="font-size:13px;color:#a78bfa;font-weight:700;margin-top:4px;">45 min</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="ctrl-section">
    <div class="ctrl-section-label">Schedule &amp; Simulation</div>
    <div class="ctrl-row">
      <div class="control-group">
        <label>Days / week</label>
        <input type="number" id="daysPerWeek" min="1" max="7" value="5" step="1">
      </div>
      <div class="control-group">
        <label>Shifts / day</label>
        <input type="number" id="shiftsPerDay" min="1" max="3" value="2" step="1">
      </div>
      <div class="control-group">
        <label>Hours / shift</label>
        <input type="number" id="hoursPerShift" min="1" max="24" value="8" step="1">
      </div>
      <div class="control-group">
        <label>Sim Speed (sim-hrs / 5s)</label>
        <input type="number" id="simSpeed" min="1" max="100" value="8" step="1">
      </div>
    </div>

  </div>

  <div class="btn-group">
    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
  </div>
</div>

<!-- Schedule Visualizer -->
<div class="sched-wrapper">
  <div class="sched-content">
    <div class="sched-track">
      <div class="sched-day" id="sched-d0"><div class="sched-fill" id="sched-f0"></div></div>
      <div class="sched-day" id="sched-d1"><div class="sched-fill" id="sched-f1"></div></div>
      <div class="sched-day" id="sched-d2"><div class="sched-fill" id="sched-f2"></div></div>
      <div class="sched-day" id="sched-d3"><div class="sched-fill" id="sched-f3"></div></div>
      <div class="sched-day" id="sched-d4"><div class="sched-fill" id="sched-f4"></div></div>
      <div class="sched-day" id="sched-d5"><div class="sched-fill" id="sched-f5"></div></div>
      <div class="sched-day" id="sched-d6"><div class="sched-fill" id="sched-f6"></div></div>
      <div class="sched-cursor" id="sched-cursor"></div>
    </div>
    <div class="sched-day-labels">
      <span id="sched-lbl-0">Mon</span>
      <span id="sched-lbl-1">Tue</span>
      <span id="sched-lbl-2">Wed</span>
      <span id="sched-lbl-3">Thu</span>
      <span id="sched-lbl-4">Fri</span>
      <span id="sched-lbl-5">Sat</span>
      <span id="sched-lbl-6">Sun</span>
    </div>
  </div>
  <div class="sched-time"><span id="dp-time">0.0</span><span class="sched-time-unit">sim-hrs</span></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  GEOMETRY CONSTANTS
// ═══════════════════════════════════════════════════════════
const STOCKS_GEO = [
  // S1 Propagation
  { fillX: 18,  fillW: 82,  fillBottom: 347, fillHeight: 194, cx: 59  },
  // S2 Buffer Warehouse
  { fillX: 213, fillW: 174, fillBottom: 397, fillHeight: 294, cx: 300 },
  // S3 Pollination Zone
  { fillX: 603, fillW: 124, fillBottom: 367, fillHeight: 234, cx: 665 },
  // S4 Post-Pollination
  { fillX: 873, fillW: 114, fillBottom: 337, fillHeight: 174, cx: 930 },
];

// ═══════════════════════════════════════════════════════════
//  SIMULATION CONSTANTS
// ═══════════════════════════════════════════════════════════
const BUFFER_CAP     = 800;
const PRIORITY_RATIO = 0.2;
const DEADLINE_HRS   = 48;
const WARN_HRS       = 40;
const PARTICLE_SEC   = 2.5;
const PROPAG_RATIO   = 0.8;

// ═══════════════════════════════════════════════════════════
//  USER PARAMETERS (separate from sim state — reset-safe)
// ═══════════════════════════════════════════════════════════
const params = {
  target:        500,   // k plants / week (user-set target throughput)
  f1Rate:        6.25,  // k plants / sim-hr (derived: target / hoursPerWeek)
  simSpeed:      8,
  daysPerWeek:   5,
  shiftsPerDay:  2,
  hoursPerShift: 8,
  // Pollination params — numWorkers derived from target + timing + schedule
  numWorkers:             94,
  plantsPerSessionK:      0.05,
  setupTimeHrs:           0.25,
  pollTimeHrs:            0.50,
  // Derived — recomputed by syncAll():
  totalFlowTimeHrs:       0.75,
  maxActiveWIP:           4.69,
  sessionsPerHr:          1.333,
  theoreticalPlantsPerHr: 6.253,
};

// ═══════════════════════════════════════════════════════════
//  SIM STATE
// ═══════════════════════════════════════════════════════════
function freshState() {
  return {
    bufReg:          200,  // k plants regular
    bufPri:          50,   // k plants priority — recomputed each tick from cohorts
    activeBatches:   [],   // [{completesAt: simHr, amount: plantsPerSessionK}, ...]
    poll:            0,    // display compat: sum(activeBatches)
    postPoll:        0,
    prAge:           0,    // display: age of oldest live cohort (sim-hrs); recomputed each tick
    failures:        0,
    elapsed:         0,    // sim-hours
    shiftOn:         true, // current shift status; recomputed each tick
    running:         false,
    nextId:          0,
    particles:       [],
    spawnAccum:      [0, 0, 0, 0],  // f1, f2-pri, f2-reg, f3
    flows:           { f1: 0, f2: 0, f2pri: 0, f2reg: 0, f3: 0, scrap: 0 },
    priorityCohorts: [{ amount: 50, deadline: DEADLINE_HRS }],  // initial 50 k-plants, arrive at t=0
    priArrivalAccum: 0,  // fractional k-plants accumulating toward next cohort
    throughputLog:   [],  // [{elapsed, rate}] sampled every 0.5 sim-hrs
    sampleAccum:     0,   // sim-hours since last sample
  };
}

let sim = freshState();

// ═══════════════════════════════════════════════════════════
//  DOM REFS
// ═══════════════════════════════════════════════════════════
const dom = {
  // SVG stocks
  s1fill:    document.getElementById('s1-fill'),
  s1shimmer: document.getElementById('s1-shimmer'),
  s1qty:     document.getElementById('s1-qty'),
  s1outer:   document.getElementById('s1-outer'),

  s2regFill: document.getElementById('s2-reg-fill'),
  s2priFill: document.getElementById('s2-pri-fill'),
  s2shimmer: document.getElementById('s2-shimmer'),
  s2qty:     document.getElementById('s2-qty'),
  s2qtySub:  document.getElementById('s2-qty-sub'),
  s2priQty:  document.getElementById('s2-pri-qty'),
  s2priSub:  document.getElementById('s2-pri-sub'),
  s2ageVal:  document.getElementById('s2-age-val'),
  s2outer:   document.getElementById('s2-outer'),

  s3fill:      document.getElementById('s3-fill'),
  s3shimmer:   document.getElementById('s3-shimmer'),
  s3qty:       document.getElementById('s3-qty'),
  s3qtySub:    document.getElementById('s3-qty-sub'),
  s3queueQty:  document.getElementById('s3-queue-qty'),
  s3maxWipVal: document.getElementById('s3-max-wip-val'),
  s3outer:     document.getElementById('s3-outer'),

  s4fill:      document.getElementById('s4-fill'),
  s4shimmer:   document.getElementById('s4-shimmer'),
  s4qty:       document.getElementById('s4-qty'),
  s4outer:     document.getElementById('s4-outer'),
  s4WklyOuter: document.getElementById('s4-wkly-outer'),
  s4WklyVal:   document.getElementById('s4-wkly'),
  s4WklySub:   document.getElementById('s4-wkly-sub'),

  // deadline bar
  deadlineBar:   document.getElementById('deadline-bar'),
  // scrap flow
  scrapRateLbl:  document.getElementById('scrap-rate-lbl'),
  scrapRateSub:  document.getElementById('scrap-rate-sub'),
  scrapQty:      document.getElementById('scrap-qty'),
  pathScrap:     document.getElementById('path-scrap'),

  // flow labels in SVG
  f1lbl:    document.getElementById('f1-lbl'),
  f2lbl:    document.getElementById('f2-lbl'),
  f2priVal: document.getElementById('f2-pri-val'),
  f3lbl:    document.getElementById('f3-lbl'),

  // particles group
  particles: document.getElementById('particles'),


  // S3 SVG
  s3queueFill: document.getElementById('s3-queue-fill'),
  workerGrid:  document.getElementById('worker-grid'),

  // controls
  targetInput:           document.getElementById('targetRate'),
  targetConvert:         document.getElementById('target-convert'),
  numWorkersInput:       document.getElementById('numWorkers'),
  numWorkersRecommended: document.getElementById('numWorkers-recommended'),
  stationCapDerived:     document.getElementById('station-cap-derived'),
  plantsPerSessionInput: document.getElementById('plantsPerSession'),
  plantsPerSessionConvert: document.getElementById('plantsPerSession-convert'),
  setupTimeInput:        document.getElementById('setupTime'),
  pollTimeInput:         document.getElementById('pollTime'),
  totalFlowTimeDisplay:  document.getElementById('totalFlowTime'),
  simSpeedInput:         document.getElementById('simSpeed'),
  daysPerWeekInput:      document.getElementById('daysPerWeek'),
  shiftsPerDayInput:     document.getElementById('shiftsPerDay'),
  hoursPerShiftInput:    document.getElementById('hoursPerShift'),
  shiftStatusEl:         document.getElementById('shift-status'),
  startBtn:         document.getElementById('startBtn'),
  resetBtn:         document.getElementById('resetBtn'),
  schedCursor:      document.getElementById('sched-cursor'),
  chartCanvas:      document.getElementById('throughputChart'),

};

const svgPaths = [
  document.getElementById('path-f1'),
  document.getElementById('path-f2'),
  document.getElementById('path-f3'),
];

const schedDays   = Array.from({length: 7}, (_, i) => document.getElementById(`sched-d${i}`));
const schedFills  = Array.from({length: 7}, (_, i) => document.getElementById(`sched-f${i}`));
const schedLabels = Array.from({length: 7}, (_, i) => document.getElementById(`sched-lbl-${i}`));

// ═══════════════════════════════════════════════════════════
//  SHIFT SCHEDULE HELPER
// ═══════════════════════════════════════════════════════════
function isShiftActive() {
  const posInWeek  = sim.elapsed % (7 * 24);
  const dayIdx     = Math.floor(posInWeek / 24);
  const posInDay   = posInWeek % 24;
  const workHrsDay = Math.min(params.shiftsPerDay * params.hoursPerShift, 24);
  return dayIdx < params.daysPerWeek && posInDay < workHrsDay;
}

// ═══════════════════════════════════════════════════════════
//  SIMULATION LOGIC
// ═══════════════════════════════════════════════════════════
function updateSimulation(wallDt) {
  // simSpeed = sim-hrs per 5 real-seconds → sim-hrs per real-second = simSpeed/5
  const simDtHrs = wallDt * params.simSpeed / 5;
  if (simDtHrs <= 0) return;  // first tick after Start has wallDt=0; skip to avoid 0/0

  const shiftOn   = isShiftActive();
  sim.shiftOn     = shiftOn;

  // ── F1: Propagation → Buffer (shift-gated with F2) ──
  const bufTotal = sim.bufReg + sim.bufPri;
  const bufFree  = BUFFER_CAP - bufTotal;
  const f1Max    = shiftOn ? Math.min(params.f1Rate, bufFree / simDtHrs) : 0;
  sim.flows.f1   = Math.max(0, f1Max);

  const f1Pri = sim.flows.f1 * PRIORITY_RATIO;
  const f1Reg = sim.flows.f1 * (1 - PRIORITY_RATIO);

  // ── Priority arrivals → cohort queue (1 k-plant batches) ──
  sim.priArrivalAccum += f1Pri * simDtHrs;
  while (sim.priArrivalAccum >= 1) {
    sim.priArrivalAccum -= 1;
    sim.priorityCohorts.push({ amount: 1, deadline: sim.elapsed + DEADLINE_HRS });
  }

  // ── Expire overdue cohorts (biological clock runs regardless of shift) ──
  let scrappedThisTick = 0;
  sim.priorityCohorts = sim.priorityCohorts.filter(c => {
    if (c.deadline <= sim.elapsed) {
      sim.failures      += c.amount;
      scrappedThisTick  += c.amount;
      return false;
    }
    return true;
  });
  sim.flows.scrap = simDtHrs > 0 ? scrappedThisTick / simDtHrs : 0;

  // ── Sort: most urgent (earliest deadline) first ──
  sim.priorityCohorts.sort((a, b) => a.deadline - b.deadline);

  // ── Derive bufPri for capacity calculation ──
  sim.bufPri = sim.priorityCohorts.reduce((s, c) => s + c.amount, 0) + sim.priArrivalAccum;

  // ── Advance elapsed, then drain completions BEFORE dispatch ──
  // This ensures workers freed this tick are available to re-dispatch immediately.
  sim.elapsed += simDtHrs;

  let completedK = 0;
  sim.activeBatches = sim.activeBatches.filter(b => {
    if (b.completesAt <= sim.elapsed) { completedK += b.amount; return false; }
    return true;
  });
  sim.postPoll += completedK;
  sim.flows.f3 = simDtHrs > 0 ? completedK / simDtHrs : 0;

  // ── F2: Direct dispatch buffer → activeBatches (shift-gated, no pollQueue) ──
  let slotsLeft = shiftOn ? Math.max(0, params.numWorkers - sim.activeBatches.length) : 0;
  let priMoved = 0, regMoved = 0;

  // Priority cohorts first (earliest deadline — already sorted above)
  for (const c of sim.priorityCohorts) {
    if (slotsLeft <= 0) break;
    while (slotsLeft > 0 && c.amount >= params.plantsPerSessionK) {
      c.amount -= params.plantsPerSessionK;
      priMoved += params.plantsPerSessionK;
      const jitter = (Math.random() - 0.5) * params.totalFlowTimeHrs;
      sim.activeBatches.push({
        amount:      params.plantsPerSessionK,
        completesAt: sim.elapsed + params.totalFlowTimeHrs + jitter,
        setupDoneAt: sim.elapsed + params.setupTimeHrs     + jitter,
      });
      slotsLeft--;
    }
  }
  sim.priorityCohorts = sim.priorityCohorts.filter(c => c.amount > 1e-9);

  // Regular buffer for remaining free slots
  while (slotsLeft > 0 && sim.bufReg >= params.plantsPerSessionK) {
    sim.bufReg -= params.plantsPerSessionK;
    regMoved   += params.plantsPerSessionK;
    const jitter = (Math.random() - 0.5) * params.totalFlowTimeHrs;
    sim.activeBatches.push({
      amount:      params.plantsPerSessionK,
      completesAt: sim.elapsed + params.totalFlowTimeHrs + jitter,
      setupDoneAt: sim.elapsed + params.setupTimeHrs     + jitter,
    });
    slotsLeft--;
  }

  sim.flows.f2    = simDtHrs > 0 ? (priMoved + regMoved) / simDtHrs : 0;
  sim.flows.f2pri = simDtHrs > 0 ? priMoved               / simDtHrs : 0;
  sim.flows.f2reg = simDtHrs > 0 ? regMoved               / simDtHrs : 0;

  // ── Update buffer stocks ──
  sim.bufReg = Math.max(0, sim.bufReg + f1Reg * simDtHrs);  // regMoved already deducted above
  sim.bufPri = Math.max(0, sim.priorityCohorts.reduce((s, c) => s + c.amount, 0) + sim.priArrivalAccum);

  // ── Recompute sim.poll for display compatibility ──
  sim.poll = sim.activeBatches.reduce((s, b) => s + b.amount, 0);

  // ── Derive prAge: age of oldest surviving cohort (for display) ──
  sim.prAge = sim.priorityCohorts.length > 0
    ? sim.elapsed - (sim.priorityCohorts[0].deadline - DEADLINE_HRS)
    : 0;

  // ── Throughput sampling (every 0.5 sim-hrs) ──
  sim.sampleAccum += simDtHrs;
  if (sim.sampleAccum >= 0.5) {
    sim.sampleAccum -= 0.5;
    sim.throughputLog.push({ elapsed: sim.elapsed, rate: sim.flows.f3 });
    if (sim.throughputLog.length > 1008) sim.throughputLog.shift();  // 336 display + 168 avg buffer = 504 hrs
  }

  // ── Spawn particles (rate × simDtHrs = k plants this tick) ──
  sim.spawnAccum[0] += sim.flows.f1    * simDtHrs;
  while (sim.spawnAccum[0] >= 1) { sim.spawnAccum[0] -= 1; spawnParticle(0, false); }

  sim.spawnAccum[1] += sim.flows.f2pri * simDtHrs;
  while (sim.spawnAccum[1] >= 1) { sim.spawnAccum[1] -= 1; spawnParticle(1, true); }

  sim.spawnAccum[2] += sim.flows.f2reg * simDtHrs;
  while (sim.spawnAccum[2] >= 1) { sim.spawnAccum[2] -= 1; spawnParticle(1, false); }

  sim.spawnAccum[3] += sim.flows.f3    * simDtHrs;
  while (sim.spawnAccum[3] >= 1) { sim.spawnAccum[3] -= 1; spawnParticle(2, false); }

  // ── Advance particles ────────────────────────────────────
  const bufRatio  = (sim.bufReg + sim.bufPri) / BUFFER_CAP;
  const pollRatio = params.maxActiveWIP > 0 ? sim.poll / (params.maxActiveWIP * 2) : 0;
  const crowding  = [bufRatio, pollRatio, 0];

  const toRemove = [];
  for (const p of sim.particles) {
    const speed = (1 / PARTICLE_SEC) * (1 - 0.65 * crowding[p.flow]);
    p.t += speed * wallDt;
    if (p.t >= 1) toRemove.push(p);
  }
  for (const p of toRemove) removeParticle(p);
}

// ═══════════════════════════════════════════════════════════
//  PARTICLE MANAGEMENT
// ═══════════════════════════════════════════════════════════
function spawnParticle(flowIndex, isPriority) {
  const id = sim.nextId++;

  let el;
  if (isPriority) {
    // Gold diamond
    el = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    el.setAttribute('fill', '#f59e0b');
    el.setAttribute('stroke', '#fde68a');
    el.setAttribute('stroke-width', '1.5');
    el.setAttribute('opacity', '0.95');
  } else {
    el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    const colors = ['#3b82f6', '#7c3aed', '#059669'];
    const strokes= ['#93c5fd', '#c4b5fd', '#6ee7b7'];
    el.setAttribute('r', '6');
    el.setAttribute('fill', colors[flowIndex]);
    el.setAttribute('stroke', strokes[flowIndex]);
    el.setAttribute('stroke-width', '1.5');
    el.setAttribute('opacity', '0.9');
  }

  dom.particles.appendChild(el);
  const p = { id, flow: flowIndex, isPriority, t: 0, el };
  sim.particles.push(p);
}

function removeParticle(p) {
  const idx = sim.particles.indexOf(p);
  if (idx !== -1) sim.particles.splice(idx, 1);
  if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
}

function clearAllParticles() {
  for (const p of sim.particles) {
    if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
  }
  sim.particles.length = 0;
  sim.spawnAccum[0] = sim.spawnAccum[1] = sim.spawnAccum[2] = sim.spawnAccum[3] = 0;
}

// ═══════════════════════════════════════════════════════════
//  RENDERING
// ═══════════════════════════════════════════════════════════
function stockColor(ratio) {
  if (ratio > 0.9) return '#ef4444';
  if (ratio < 0.1) return '#f59e0b';
  return null;  // use stock's own color
}

function renderFrame() {
  const bufTotal  = sim.bufReg + sim.bufPri;
  const bufRatio  = bufTotal / BUFFER_CAP;
  const activeWIP = sim.activeBatches.reduce((s, b) => s + b.amount, 0);
  const totalS3   = activeWIP;  // no pollQueue; S3 = active WIP only
  const refCap    = params.maxActiveWIP * 2;
  const pollRatio = refCap > 0 ? totalS3 / refCap : 0;
  const postRatio = Math.min(sim.postPoll / 2000, 1);

  // ── S1 Propagation (constant 80%) ──
  const g1 = STOCKS_GEO[0];
  const h1 = PROPAG_RATIO * g1.fillHeight;
  const y1 = g1.fillBottom - h1;
  dom.s1fill.setAttribute('y', y1);
  dom.s1fill.setAttribute('height', h1);
  dom.s1fill.setAttribute('fill', '#1d4ed8');
  dom.s1shimmer.setAttribute('y', y1);
  dom.s1shimmer.setAttribute('opacity', '0.5');
  dom.s1qty.textContent = '∞';

  // ── S2 Buffer Warehouse (dual fill) ──
  const g2 = STOCKS_GEO[1];
  const regRatio = sim.bufReg / BUFFER_CAP;
  const priRatio = sim.bufPri / BUFFER_CAP;
  const regH = regRatio * g2.fillHeight;
  const priH = priRatio * g2.fillHeight;
  const regY = g2.fillBottom - regH;
  const priY = regY - priH;

  dom.s2regFill.setAttribute('y', regY);
  dom.s2regFill.setAttribute('height', regH);
  dom.s2priFill.setAttribute('y', priY);
  dom.s2priFill.setAttribute('height', priH);
  dom.s2shimmer.setAttribute('y', Math.min(priY, regY));
  dom.s2shimmer.setAttribute('opacity', (regH + priH) > 5 ? '0.5' : '0');

  const s2borderCol = bufRatio > 0.9 ? '#ef4444' : bufRatio < 0.1 ? '#f59e0b' : '#334155';
  dom.s2outer.setAttribute('stroke', s2borderCol);
  dom.s2qty.textContent    = bufTotal.toFixed(0);
  dom.s2qtySub.textContent = `${(bufRatio * 100).toFixed(0)}% full`;
  const priPct = bufTotal > 0 ? (sim.bufPri / bufTotal * 100).toFixed(0) : 0;
  dom.s2priQty.textContent = Math.round(sim.bufPri * 1000).toLocaleString();
  dom.s2priSub.textContent = `${priPct}% of buffer`;
  dom.s2priQty.setAttribute('fill', sim.bufPri > 0 ? '#f59e0b' : '#475569');

  // ── S2 Deadline bar ──
  const ageRatio = Math.min(sim.prAge / DEADLINE_HRS, 1);
  const barW     = ageRatio * 154;
  const barColor = sim.prAge > WARN_HRS ? '#ef4444' : sim.prAge > 30 ? '#f59e0b' : '#10b981';
  dom.s2ageVal.textContent = `${sim.prAge.toFixed(1)} / 48h`;
  dom.s2ageVal.setAttribute('fill', barColor);
  dom.deadlineBar.setAttribute('width', barW);
  dom.deadlineBar.setAttribute('fill', barColor);

  // ── Scrap flow ──
  const scrapActive = sim.flows.scrap > 0;
  dom.pathScrap.setAttribute('stroke-opacity', scrapActive ? '1' : '0.25');
  dom.scrapRateLbl.textContent = sim.flows.scrap > 0
    ? `${sim.flows.scrap.toFixed(1)} k/hr`
    : '';
  dom.scrapRateLbl.setAttribute('fill', scrapActive ? '#ef4444' : '#475569');
  dom.scrapQty.textContent    = Math.round(sim.failures * 1000).toLocaleString();
  dom.scrapRateSub.textContent = sim.failures > 0
    ? `${(sim.failures / params.target * 100).toFixed(1)}% of target`
    : 'cumulative';

  // ── S3 Worker Grid ──
  const workerPolling = sim.activeBatches.filter(b => (b.setupDoneAt ?? -Infinity) <= sim.elapsed).length;
  const workerSetup   = sim.activeBatches.filter(b => (b.setupDoneAt ?? -Infinity) >  sim.elapsed).length;
  const workerIdle    = params.numWorkers - sim.activeBatches.length;
  const N    = params.numWorkers;
  const cols = N <= 50 ? 5 : N <= 80 ? 8 : 10;
  const rows = Math.ceil(N / cols);
  const gap  = 1;
  const gridX = 606, gridY = 136;
  const gridW = 118, gridH = 228;
  const cellW = Math.floor((gridW - gap * (cols - 1)) / cols);
  const cellH = Math.min(cellW, Math.floor((gridH - gap * (rows - 1)) / rows));

  if (dom.workerGrid.childElementCount !== N) {
    while (dom.workerGrid.firstChild) dom.workerGrid.removeChild(dom.workerGrid.firstChild);
    for (let i = 0; i < N; i++) {
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('width',  cellW);
      r.setAttribute('height', cellH);
      r.setAttribute('rx', '1');
      dom.workerGrid.appendChild(r);
    }
  }
  const wRects = dom.workerGrid.children;
  for (let i = 0; i < N; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    wRects[i].setAttribute('x', gridX + col * (cellW + gap));
    wRects[i].setAttribute('y', gridY + row * (cellH + gap));
    wRects[i].setAttribute('fill',
      i < workerPolling             ? '#7c3aed'   // purple: actively pollinating
      : i < workerPolling + workerSetup ? '#d97706'  // amber: transit / setup
      : '#1e3a5f');                                // dark-slate: idle
  }

  dom.s3fill.setAttribute('height', 0);      // hide old liquid fill
  dom.s3queueFill.setAttribute('height', 0);
  dom.s3shimmer.setAttribute('opacity', '0');
  dom.s3outer.setAttribute('stroke',
    workerIdle === 0 ? '#a78bfa' : workerIdle === N ? '#f59e0b' : '#334155');
  dom.s3qty.textContent       = activeWIP.toFixed(1);
  dom.s3qtySub.textContent    = `${workerPolling} workers pollinating`;
  dom.s3queueQty.textContent  = workerSetup;
  dom.s3maxWipVal.textContent = workerPolling;

  // ── S4 Post-Pollination ──
  const g4 = STOCKS_GEO[3];
  const h4 = postRatio * g4.fillHeight;
  const y4 = g4.fillBottom - h4;
  dom.s4fill.setAttribute('y', y4);
  dom.s4fill.setAttribute('height', h4);
  dom.s4shimmer.setAttribute('y', y4);
  dom.s4shimmer.setAttribute('opacity', h4 > 5 ? '0.4' : '0');
  dom.s4qty.textContent = sim.postPoll.toFixed(0);

  // ── Schedule visualizer ──
  const posInWeek     = sim.elapsed % (7 * 24);
  const activeDayIdx  = Math.floor(posInWeek / 24);
  const workHrsPerDay = Math.min(params.shiftsPerDay * params.hoursPerShift, 24);
  dom.schedCursor.style.left = `${(posInWeek / (7 * 24)) * 100}%`;
  for (let d = 0; d < 7; d++) {
    const isWorkDay = d < params.daysPerWeek;
    const isActive  = d === activeDayIdx;
    schedFills[d].style.width     = isWorkDay ? `${(workHrsPerDay / 24) * 100}%` : '0%';
    schedDays[d].style.background = isActive  ? '#182435' : '#0f172a';
    schedLabels[d].style.color    = isWorkDay ? '#94a3b8' : '#334155';
  }

  // ── Flow labels ──
  dom.f1lbl.textContent    = sim.flows.f1.toFixed(1);
  dom.f2lbl.textContent    = sim.flows.f2.toFixed(1);
  dom.f2priVal.textContent = sim.flows.f2pri.toFixed(1);
  dom.f3lbl.textContent    = sim.flows.f3.toFixed(1);

  // ── Shift status indicator ──
  if (dom.shiftStatusEl) {
    dom.shiftStatusEl.textContent = sim.shiftOn ? 'ON SHIFT' : 'OFF SHIFT';
    dom.shiftStatusEl.setAttribute('fill', sim.shiftOn ? '#10b981' : '#475569');
  }
  const flowOpacity = sim.shiftOn ? '1' : '0.35';
  document.getElementById('path-f1').setAttribute('opacity', flowOpacity);
  document.getElementById('path-f2').setAttribute('opacity', flowOpacity);
  dom.f1lbl.parentElement.setAttribute('opacity', flowOpacity);
  dom.f2lbl.parentElement.setAttribute('opacity', flowOpacity);


  // ── Particles ──
  for (const p of sim.particles) {
    const path = svgPaths[p.flow];
    const len  = path.getTotalLength();
    const pt   = path.getPointAtLength(p.t * len);
    if (p.isPriority) {
      const s = 7;
      const cx = pt.x, cy = pt.y;
      p.el.setAttribute('points', `${cx-s},${cy} ${cx},${cy-s} ${cx+s},${cy} ${cx},${cy+s}`);
    } else {
      p.el.setAttribute('cx', pt.x);
      p.el.setAttribute('cy', pt.y);
    }
  }

  // ── Data panel ──

  const WEEK_HRS   = 168;
  const recentLog  = sim.throughputLog.filter(s => s.elapsed > sim.elapsed - WEEK_HRS);
  const avgRate    = recentLog.length > 0
    ? recentLog.reduce((sum, s) => sum + s.rate, 0) / recentLog.length
    : sim.flows.f3;
  const weeklyOutput = avgRate * WEEK_HRS;

  dom.s4WklyVal.textContent = weeklyOutput.toFixed(0);
  dom.s4WklySub.textContent = `${(weeklyOutput / params.target * 100).toFixed(0)}% of ${params.target}k target`;
  dom.s4WklyOuter.setAttribute('stroke', weeklyOutput >= params.target ? '#10b981' : '#334155');

  // ── Alert banner ──

  // ── Throughput chart ──
  renderChart();
}

// ═══════════════════════════════════════════════════════════
//  THROUGHPUT CHART
// ═══════════════════════════════════════════════════════════
function renderChart() {
  const canvas = dom.chartCanvas;
  if (!canvas) return;
  const cssW = canvas.clientWidth;
  const cssH = canvas.clientHeight;
  if (!cssW || !cssH) return;

  const dpr = window.devicePixelRatio || 1;
  const tW = Math.round(cssW * dpr);
  const tH = Math.round(cssH * dpr);
  if (canvas.width !== tW || canvas.height !== tH) { canvas.width = tW; canvas.height = tH; }

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);  // reset each frame; draw in CSS px

  const W = cssW, H = cssH;
  const ml = 46, mr = 16, mt = 22, mb = 26;
  const cW = W - ml - mr;
  const cH = H - mt - mb;

  // Background
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, W, H);

  // ── Scales ──
  const WEEK_HRS  = 168;               // sim-hours in a calendar week
  const yMax      = params.target * 1.6;  // 800 k/wk
  const log       = sim.throughputLog;
  const xEnd      = Math.max(sim.elapsed, 24);
  const xWindow   = 336;               // show last 2 sim-weeks
  const xStart    = Math.max(0, xEnd - xWindow);
  const xRange    = xEnd - xStart;

  const toX = e  => ml + ((e - xStart) / xRange) * cW;
  const toY = kw => mt + cH - Math.max(0, Math.min(kw / yMax, 1)) * cH;

  // ── Horizontal grid ──
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;
  for (const y of [250, 500, 750]) {
    const yy = toY(y);
    ctx.beginPath(); ctx.moveTo(ml, yy); ctx.lineTo(ml + cW, yy); ctx.stroke();
  }

  // ── Target line ──
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 4]);
  const ty = toY(params.target);
  ctx.beginPath(); ctx.moveTo(ml, ty); ctx.lineTo(ml + cW, ty); ctx.stroke();
  ctx.setLineDash([]);

  if (log.length > 1) {
    // ── Pre-compute rolling averages (O(n) sliding window) ──
    const DAY_WIN  = 24;
    const WEEK_WIN = 168;
    const avgDay   = new Float32Array(log.length);
    const avgWeek  = new Float32Array(log.length);
    let sdSum = 0, sdStart = 0, swSum = 0, swStart = 0;
    for (let i = 0; i < log.length; i++) {
      sdSum += log[i].rate; swSum += log[i].rate;
      while (log[i].elapsed - log[sdStart].elapsed > DAY_WIN ) { sdSum -= log[sdStart++].rate; }
      while (log[i].elapsed - log[swStart].elapsed > WEEK_WIN) { swSum -= log[swStart++].rate; }
      avgDay[i]  = sdSum / (i - sdStart  + 1);
      avgWeek[i] = swSum / (i - swStart + 1);
    }

    // Only draw each average once a full window of data exists in the log
    const logStart      = log[0].elapsed;
    const dayAvailFrom  = logStart + DAY_WIN;
    const weekAvailFrom = logStart + WEEK_WIN;

    // ── Grey line: 24-sim-hr rolling average ──
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    let first = true;
    for (let i = 0; i < log.length; i++) {
      if (log[i].elapsed < xStart || log[i].elapsed < dayAvailFrom) { first = true; continue; }
      const x = toX(log[i].elapsed);
      const y = toY(avgDay[i] * WEEK_HRS);
      if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // ── Blue line: 168-sim-hr (1-week) rolling average ──
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 2;
    ctx.beginPath();
    first = true;
    for (let i = 0; i < log.length; i++) {
      if (log[i].elapsed < xStart || log[i].elapsed < weekAvailFrom) { first = true; continue; }
      const x = toX(log[i].elapsed);
      const y = toY(avgWeek[i] * WEEK_HRS);
      if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // ── Axes ──
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ml, mt); ctx.lineTo(ml, mt + cH); ctx.lineTo(ml + cW, mt + cH);
  ctx.stroke();

  // ── Y axis labels ──
  ctx.fillStyle = '#475569';
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (const y of [0, 250, 500, 750]) {
    ctx.fillText(y === 0 ? '0' : `${y}k`, ml - 5, toY(y));
  }

  // ── X axis ticks & labels (every 24 sim-hrs) ──
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#334155';
  const tickStart = Math.ceil(xStart / 24) * 24;
  for (let t = tickStart; t <= xEnd; t += 24) {
    const x = toX(t);
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(x, mt + cH); ctx.lineTo(x, mt + cH + 3); ctx.stroke();
    ctx.fillStyle = '#334155';
    ctx.fillText(`${Math.round(t)}h`, x, mt + cH + 5);
  }

  // ── Legend ──
  const legY = mt - 10;
  ctx.textBaseline = 'middle';
  let lx = ml;
  ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(lx, legY); ctx.lineTo(lx + 16, legY); ctx.stroke();
  ctx.fillStyle = '#64748b'; ctx.textAlign = 'left';
  ctx.fillText('24h avg', lx + 20, legY); lx += 72;

  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(lx, legY); ctx.lineTo(lx + 16, legY); ctx.stroke();
  ctx.fillStyle = '#64748b';
  ctx.fillText('7-day avg', lx + 20, legY); lx += 84;

  ctx.strokeStyle = '#10b981'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(lx, legY); ctx.lineTo(lx + 16, legY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#10b981';
  ctx.fillText(`target ${params.target}k / wk`, lx + 20, legY);

  // ── Y axis title ──
  ctx.save();
  ctx.translate(10, mt + cH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#334155'; ctx.font = '10px system-ui, sans-serif';
  ctx.fillText('k plants / week', 0, 0);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════════
let lastTime = null;

function tick(timestamp) {
  if (sim.running) {
    if (!lastTime) lastTime = timestamp;
    const wallDt = Math.min((timestamp - lastTime) / 1000, 0.05);
    lastTime = timestamp;
    updateSimulation(wallDt);
  }
  renderFrame();
  requestAnimationFrame(tick);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) lastTime = null;
});

// ═══════════════════════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════════════════════
function clamp(v, lo, hi) {
  const n = parseFloat(v);
  return isNaN(n) ? lo : Math.max(lo, Math.min(hi, n));
}

function syncAll() {
  const hoursPerWeek = params.daysPerWeek * params.shiftsPerDay * params.hoursPerShift;

  // Target
  params.target = clamp(dom.targetInput.value, 0, 5000);

  // Pollination timing (must precede effective-hours calculation)
  params.plantsPerSessionK = clamp(dom.plantsPerSessionInput.value, 1, 1000) / 1000;
  params.setupTimeHrs      = clamp(dom.setupTimeInput.value, 1, 240) / 60;
  params.pollTimeHrs       = clamp(dom.pollTimeInput.value,  1, 480) / 60;
  params.totalFlowTimeHrs  = params.setupTimeHrs + params.pollTimeHrs;

  // In steady state, batches carry over between shifts so there is no per-shift startup lag.
  // Use full hoursPerWeek for both rate and headcount derivations.
  params.f1Rate = hoursPerWeek > 0 ? params.target / hoursPerWeek : 0;
  dom.targetConvert.textContent = `= ${params.f1Rate.toFixed(2)} k/hr`;

  // Required workers: sessions/week × flow time per session ÷ working hours/week
  const sessionsPerWeek    = params.plantsPerSessionK > 0 ? params.target / params.plantsPerSessionK : 0;
  const recommendedWorkers = hoursPerWeek > 0
    ? Math.max(1, Math.ceil((params.totalFlowTimeHrs * sessionsPerWeek) / hoursPerWeek))
    : 1;

  if (dom.numWorkersRecommended) dom.numWorkersRecommended.textContent = `Recommended: ${recommendedWorkers.toLocaleString()}`;
  if (!dom.numWorkersInput.value) dom.numWorkersInput.value = recommendedWorkers;
  params.numWorkers = Math.max(1, parseInt(dom.numWorkersInput.value) || recommendedWorkers);

  // Derived aggregates
  params.maxActiveWIP           = params.numWorkers * params.plantsPerSessionK;
  params.sessionsPerHr          = params.totalFlowTimeHrs > 0 ? 1 / params.totalFlowTimeHrs : 0;
  params.theoreticalPlantsPerHr = params.totalFlowTimeHrs > 0
    ? params.maxActiveWIP / params.totalFlowTimeHrs : 0;

  // Update displays
  const totalMin = Math.round(params.totalFlowTimeHrs * 60);
  if (dom.totalFlowTimeDisplay)    dom.totalFlowTimeDisplay.textContent    = `${totalMin} min`;
  if (dom.plantsPerSessionConvert) dom.plantsPerSessionConvert.textContent = `= ${params.plantsPerSessionK.toFixed(4)} k-plants`;
  if (dom.stationCapDerived)       dom.stationCapDerived.textContent       = `${params.theoreticalPlantsPerHr.toFixed(2)} k/hr`;
}

dom.targetInput.addEventListener('input',          syncAll);
dom.simSpeedInput.addEventListener('input',        () => { params.simSpeed = clamp(dom.simSpeedInput.value, 1, 100); });
dom.daysPerWeekInput.addEventListener('input',     () => { params.daysPerWeek   = clamp(dom.daysPerWeekInput.value,   1,  7); syncAll(); });
dom.shiftsPerDayInput.addEventListener('input',    () => { params.shiftsPerDay  = clamp(dom.shiftsPerDayInput.value,  1,  3); syncAll(); });
dom.hoursPerShiftInput.addEventListener('input',   () => { params.hoursPerShift = clamp(dom.hoursPerShiftInput.value, 1, 24); syncAll(); });
dom.numWorkersInput.addEventListener('input',       syncAll);
dom.plantsPerSessionInput.addEventListener('input', syncAll);
dom.setupTimeInput.addEventListener('input',        syncAll);
dom.pollTimeInput.addEventListener('input',         syncAll);

syncAll();

dom.startBtn.addEventListener('click', () => {
  sim.running = !sim.running;
  if (sim.running) {
    lastTime = null;
    dom.startBtn.textContent = 'Pause';
    dom.startBtn.classList.add('paused');
  } else {
    dom.startBtn.textContent = 'Resume';
    dom.startBtn.classList.add('paused');
  }
});

dom.resetBtn.addEventListener('click', () => {
  sim.running = false;
  lastTime = null;
  dom.startBtn.textContent = 'Start';
  dom.startBtn.classList.remove('paused');

  clearAllParticles();
  sim = freshState();
  renderFrame();
});

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
renderFrame();
requestAnimationFrame(tick);
</script>
</body>
</html>
